<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Facebook – вход или регистрация</title>
    <link rel="stylesheet" href="slyle.css">
</head>
<body>

    <main class="login-page">
        <div class="login-container">
            <section class="login-promo">
                <img class="fb-logo" src="img/1fac.jpeg" alt="Facebook">
                <h2 class="promo-subtitle">Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.</h2>
            </section>

            <section class="login-auth">
                <div class="auth-box">
                    <form class="auth-form">
                        <input type="text" placeholder="Электронный адрес или номер телефона" class="input-field" required>
                        <input type="password" placeholder="Пароль" class="input-field" required>
                        
                        <button type="submit" class="btn-login">Вход</button>
                        
                        <a href="#" class="link-forgot">Забыли пароль?</a>
                        
                        <div class="divider"></div>
                        
                        <button type="button" class="btn-new-account">Создать новый аккаунт</button>
                    </form>
                </div>
                <p class="create-page-text">
                    <a href="#"><b>Создать Страницу</b></a> знаменитости, музыкальной группы или компании.
                </p>
            </section>
        </div>
    </main>

    <footer class="footer-simple">
        <div class="footer-container">
            <div class="languages">
                <span>Русский</span> · <a href="#">English (US)</a> · <a href="#">Қазақша</a> · <a href="#">Türkçe</a>
            </div>
            <div class="footer-divider"></div>
            <div class="copyright">Meta © 2026</div>
        </div>
    </footer>

</body>
</html>
